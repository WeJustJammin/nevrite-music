name: AC265 hosted-runner authorization foundation (not hosted acceptance)

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Opaque registered AC265 staging candidate reference
        required: true
        type: string

permissions: { contents: read }

jobs:
  authorize:
    name: Authorization foundation only (no hosted acceptance)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the approved workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned project runtime
        uses: ./.github/actions/setup
      - name: Verify system Google Chrome
        run: bash infra/workflows/verify-system-chrome.sh
      - name: Issue a redacted runner authorization
        env:
          AC265_CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: node --experimental-strip-types infra/workflows/run-ac265-hosted-runner-authorization.ts

name: Preflight AC265 hosted E2E candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase source SHA represented by the staging candidate
        required: true
        type: string
      staging_run_id:
        description: Successful staging deployment workflow run ID
        required: true
        type: string
      staging_run_attempt:
        description: Successful staging deployment workflow run attempt
        required: true
        type: string
      ci_run_id:
        description: Successful CI workflow run ID for source_sha
        required: true
        type: string
      ci_run_attempt:
        description: Successful CI workflow run attempt for source_sha
        required: true
        type: string
      staging_deployment_id:
        description: Staging deployment ID represented by the candidate
        required: true
        type: string

concurrency:
  group: ac265-hosted-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions: { actions: read, contents: read, deployments: read }

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_ORIGIN }}
    outputs:
      candidate_ref: ${{ steps.enroll.outputs.candidate_ref }}
    steps:
      - name: Check out the approved workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact staging and CI candidate provenance
        id: preflight
        uses: ./.github/actions/ac265-hosted-e2e-preflight
        with:
          source_sha: ${{ inputs.source_sha }}
          staging_run_id: ${{ inputs.staging_run_id }}
          staging_run_attempt: ${{ inputs.staging_run_attempt }}
          ci_run_id: ${{ inputs.ci_run_id }}
          ci_run_attempt: ${{ inputs.ci_run_attempt }}
          staging_deployment_id: ${{ inputs.staging_deployment_id }}
          staging_web_origin: ${{ vars.STAGING_WEB_ORIGIN }}
          staging_api_origin: ${{ vars.STAGING_API_ORIGIN }}
          hosting_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          supabase_project_ref: ${{ vars.SUPABASE_PROJECT_REF }}
          supabase_origin: ${{ vars.SUPABASE_URL }}
      - name: Register exact candidate in staging
        id: enroll
        env:
          AC265_ENROLLMENT_REQUEST_PATH: ${{ steps.preflight.outputs.enrollment_request_path }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node --experimental-strip-types infra/workflows/register-ac265-candidate-enrollment.ts
      - name: Persist candidate reference artifact
        env:
          AC265_CANDIDATE_REF: ${{ steps.enroll.outputs.candidate_ref }}
        run: node --experimental-strip-types infra/workflows/write-ac265-candidate-ref-artifact.ts
      - name: Upload candidate reference artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ac265-candidate-ref-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ac265-candidate-ref.txt
          if-no-files-found: error
          retention-days: 1

name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run containing the immutable build artifact
        required: true
        type: string
      deploy_sha:
        description: Full commit SHA associated with the CI artifact
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Promote immutable artifacts to staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, wejammin]
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_ORIGIN }}
    env:
      CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.deploy_sha }}
      STAGING_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
      STAGING_WEB_ORIGIN: ${{ vars.STAGING_WEB_ORIGIN }}
    steps:
      - name: Check out the promoted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Download immutable CI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: workspace-build-${{ env.DEPLOY_SHA }}
          path: .artifacts
          run-id: ${{ env.CI_RUN_ID }}

      - name: Verify artifact boundaries and record digests
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::DEPLOY_SHA must be a full lowercase commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -f .artifacts/web/dist/client/index.html
          test -f .artifacts/worker/dist/index.js

      - name: Record promoted artifact digests
        shell: bash
        run: |
          set -euo pipefail
          find .artifacts -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > deployment-manifest.sha256

      - name: Deploy Pages staging artifact
        run: >-
          pnpm --filter @wejammin/web exec wrangler pages deploy
          "$GITHUB_WORKSPACE/.artifacts/web/dist/client"
          --project-name wejammin-web-staging
          --branch main
          --commit-hash "$DEPLOY_SHA"
          --commit-message "Staging $DEPLOY_SHA"
          --commit-dirty=true

      - name: Deploy Worker staging artifact
        run: >-
          pnpm --filter @wejammin/worker exec wrangler deploy
          "$GITHUB_WORKSPACE/.artifacts/worker/dist/index.js"
          --config wrangler.jsonc
          --env staging
          --var APP_ENVIRONMENT:staging
          --var APP_RELEASE:"$DEPLOY_SHA"

      - name: Verify public staging contracts
        run: pnpm verify:staging

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-deployment-${{ env.DEPLOY_SHA }}
          path: deployment-manifest.sha256
          if-no-files-found: error
          retention-days: 30

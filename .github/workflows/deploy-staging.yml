name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
concurrency:
  group: deploy-staging
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
jobs:
  deploy:
    name: Promote immutable artifacts to staging
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, wejammin]
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_ORIGIN }}
    env:
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      STAGING_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
      STAGING_WEB_ORIGIN: ${{ vars.STAGING_WEB_ORIGIN }}
    steps:
      - name: Check out the promoted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Download immutable CI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: workspace-build-${{ env.DEPLOY_SHA }}
          path: .artifacts
          run-id: ${{ env.CI_RUN_ID }}

      - name: Verify artifact boundaries and deployment inputs
        run: bash infra/workflows/verify-staging-artifacts.sh

      - name: Record promoted artifact digests
        run: >-
          bash infra/workflows/record-staging-artifacts.sh &&
          bash infra/workflows/prepare-staging-candidate.sh

      - name: Deploy API Worker staging artifact
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @wejammin/worker exec wrangler deploy
          "$GITHUB_WORKSPACE/.artifacts/apps/worker/dist/index.js"
          --config wrangler.jsonc
          --env staging
          --var APP_ENVIRONMENT:staging
          --var APP_RELEASE:"$DEPLOY_SHA"

      - name: Deploy web SSR Worker staging artifact
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @wejammin/web exec wrangler deploy
          --config "$GITHUB_WORKSPACE/.artifacts/apps/web/dist/server/wrangler.staging.json"
          --domain "$WEB_CUSTOM_DOMAIN"

      - name: Verify public staging contracts
        run: pnpm verify:staging && touch promotion-candidate/staging-verification.passed

      - name: Finalize staging promotion evidence
        run: bash infra/workflows/finalize-staging-candidate.sh

      - name: Verify release promotion evidence
        run: >-
          node --experimental-strip-types infra/verify-release-promotion.ts
          promotion-candidate/promotion-metadata.json candidate

      - name: Publish staging-verified promotion candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-verified-candidate
          path: promotion-candidate
          if-no-files-found: error
          retention-days: 30

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-deployment-${{ env.DEPLOY_SHA }}
          path: deployment-manifest.sha256
          if-no-files-found: error
          retention-days: 30

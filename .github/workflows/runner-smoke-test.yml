# Smoke test for the self-hosted runner fleet.
# Purpose: prove the runners can claim and execute a job end-to-end.
# This is TEMPORARY scaffolding — /setup-workspace-cicd defines the real pipeline.
name: Runner Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runner-smoke-test.yml'

# Never grant more than the job needs.
permissions:
  contents: read

jobs:
  smoke:
    name: Verify runner ${{ matrix.n }}
    runs-on: [self-hosted, wejammin]
    strategy:
      # Fan across the fleet: 3 concurrent jobs must occupy 3 distinct runners.
      matrix:
        n: [1, 2, 3]
      fail-fast: false
    timeout-minutes: 5

    steps:
      - name: Identify runner
        run: |
          echo "runner name : $RUNNER_NAME"
          echo "runner os   : $RUNNER_OS / $RUNNER_ARCH"
          echo "host        : $(uname -srm)"
          echo "cores       : $(nproc)"

      - name: Verify toolchain reachable
        run: |
          echo "git    : $(git --version 2>/dev/null || echo MISSING)"
          echo "curl   : $(curl --version 2>/dev/null | head -1 || echo MISSING)"
          echo "docker : $(docker --version 2>/dev/null || echo 'MISSING (ok — not required yet)')"

      - name: Verify egress to Cloudflare
        run: |
          # The deploy target must be reachable from the runner, not just from the laptop.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.cloudflare.com/client/v4/ || echo "000")
          echo "api.cloudflare.com -> HTTP $code"
          if [ "$code" = "000" ]; then echo "::error::no egress to Cloudflare API"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm workspace
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          echo "files at root: $(ls -1 | wc -l)"
          test -f CLAUDE.md && echo "repo contents present: yes"

name: Diagnose production AC209 email visibility

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full lowercase main revision containing this diagnostic
        required: true
        type: string
      window_start:
        description: Inclusive UTC start of the historical exercise window
        required: true
        type: string
      window_end:
        description: Inclusive UTC end of the historical exercise window
        required: true
        type: string
      confirm_diagnostic:
        description: Confirm protected read-only AC209 email diagnostic
        required: true
        type: boolean
        default: false

concurrency:
  group: diagnose-production-ac209-email
  cancel-in-progress: false

permissions: { contents: read }

jobs:
  preflight:
    if: inputs.confirm_diagnostic == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wejammin]
    timeout-minutes: 5
    steps:
      - name: Verify dispatch intent and exact main revision
        env:
          CONFIRM_DIAGNOSTIC: ${{ inputs.confirm_diagnostic }}
          DISPATCHED_SOURCE_SHA: ${{ github.sha }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          test "$CONFIRM_DIAGNOSTIC" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$SOURCE_REVISION" = "$DISPATCHED_SOURCE_SHA"
      - name: Check out the exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Verify live production environment protection
        env:
          CONFIRM_VERIFICATION: ${{ inputs.confirm_diagnostic }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_revision }}
        run: node --experimental-strip-types infra/workflows/verify-production-environment.ts

  diagnose:
    needs: preflight
    runs-on: [self-hosted, wejammin]
    timeout-minutes: 10
    environment: { name: production }
    env:
      AC209_DIAGNOSTIC_OUTPUT_PATH: ac209-diagnostic/email.json
      EXPECTED_ALERT_SUBJECT: '[WeJammin] dlq_nonempty'
    steps:
      - name: Check out the exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Verify protected execution identity
        env:
          EXPECTED_SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$checked_out_sha" = "$EXPECTED_SOURCE_REVISION"
      - name: Set up pinned workspace dependencies
        uses: ./.github/actions/setup
      - name: Reverify immutable workspace before secret use
        env:
          EXPECTED_SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$checked_out_sha" = "$EXPECTED_SOURCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Collect redacted AC209 email diagnostic
        env:
          CLOUDFLARE_EMAIL_ZONE_ID: '${{ vars.CLOUDFLARE_EMAIL_ZONE_ID }}'
          CLOUDFLARE_OBSERVABILITY_API_TOKEN: '${{ secrets.CLOUDFLARE_OBSERVABILITY_API_TOKEN }}'
          EXPECTED_ALERT_SENDER_SHA256: '${{ vars.PRODUCTION_ALERT_SENDER_SHA256 }}'
          EXPECTED_ALERT_EMAIL_SHA256: '${{ vars.PRODUCTION_ALERT_EMAIL_SHA256 }}'
          SOURCE_REVISION: ${{ inputs.source_revision }}
          AC209_DIAGNOSTIC_WINDOW_START: ${{ inputs.window_start }}
          AC209_DIAGNOSTIC_WINDOW_END: ${{ inputs.window_end }}
        run: node --experimental-strip-types infra/workflows/diagnose-production-ac209-email.ts
      - name: Upload redacted AC209 email diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-ac209-email-diagnostic-${{ inputs.source_revision }}
          path: ac209-diagnostic/email.json
          if-no-files-found: warn
          retention-days: 7

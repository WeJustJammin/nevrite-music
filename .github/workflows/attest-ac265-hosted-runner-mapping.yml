name: AC265 protected source foundation (runner mapping attestation)

on:
  workflow_dispatch:
    inputs:
      authorization_ref:
        description: Protected AC265 authorization reference
        required: true
        type: string
      mapping_id:
        description: Approved AC265 runner-mapping identifier
        required: true
        type: string

permissions: { contents: read }

jobs:
  attest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions: { contents: read }
    steps:
      - name: Check out the immutable dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned workspace dependencies
        uses: ./.github/actions/setup

      - name: Create protected canonical runner-mapping attestation
        env:
          AC265_AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          AC265_MAPPING_ID: ${{ inputs.mapping_id }}
          AC265_RUNNER_MAPPING_OUTPUT_DIR: ${{ runner.temp }}/ac265-runner-mapping
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AC265_RUNNER_MAPPING_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AC265_RUNNER_MAPPING_SIGNING_PRIVATE_KEY_PEM }}
          AC265_RUNNER_MAPPING_SIGNING_KEY_ID: ${{ vars.AC265_RUNNER_MAPPING_SIGNING_KEY_ID }}
        run: node --experimental-strip-types infra/workflows/attest-ac265-approved-runner-mapping.ts

      - name: Upload protected mapping source artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ac265-runner-mapping-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ac265-runner-mapping/canonical-runner-mapping.json
            ${{ runner.temp }}/ac265-runner-mapping/runner-mapping-attestation.json
          if-no-files-found: error
          retention-days: 1

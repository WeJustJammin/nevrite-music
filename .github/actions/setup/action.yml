name: Set up WeJammin workspace
description: Install the pinned Node.js and pnpm toolchain with the frozen workspace lockfile.

runs:
  using: composite
  steps:
    - name: Set up pnpm 11.24.0
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 11.24.0

    - name: Set up Node.js from .node-version
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        cache: pnpm
        node-version-file: .node-version

    - name: Install frozen workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
